name: FHEC CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace --locked

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked -p fhec-cli

      - name: Example compilation
        run: cargo run --release --locked -p fhec-cli -- build examples/addition.fhe

      - name: Example analysis
        run: cargo run --release --locked -p fhec-cli -- analyze examples/addition.fhe
